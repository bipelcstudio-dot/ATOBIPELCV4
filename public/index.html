<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIPELC OS</title><style>

e th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.table th{font-size:12px;color:var(--muted);background:#fafafa}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;background:#eee}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{width:100%;border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px}.toolbar input{max-width:280px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.field.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.close{border:0;background:#eee;border-radius:8px;padding:7px}.login{min-height:100vh;display:grid;place-items:center;background:#111}.loginbox{width:min(420px,92vw);background:#fff;border-radius:20px;padding:28px}.loginbox h1{margin-top:0}.error{color:#b42318;background:#fee4e2;border-radius:10px;padding:10px;margin:10px 0}.success{color:#087443;background:#dff7e9;border-radius:10px;padding:10px;margin:10px 0}.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.empty{padding:30px;text-align:center;color:var(--muted)}.permgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.perm{border:1px solid var(--line);padding:9px;border-radius:10px;display:flex;gap:8px;align-items:center}.mobilebar{display:none}@media(max-width:900px){.side{display:none}.main{margin:0;width:100%;padding:16px}.stats,.actions{grid-template-columns:repeat(2,1fr)}.mobilebar{display:flex;justify-content:space-between;margin-bottom:16px}.formgrid{grid-template-columns:1fr}}@media(max-width:520px){.stats,.actions{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><div id="root"></div><div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">ثبت</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ME=null, permissions=[]; const nav=[['dashboard','داشبورد','dashboard.view'],['clients','مشتریان','clients.view'],['projects','پروژه‌ها','projects.view'],['tasks','تسک‌ها','tasks.view'],['employees','کارمندان','users.view'],['hr','منابع انسانی','hr.view'],['freelancers','فریلنسرها','freelancers.view'],['legal','حقوقی','legal.view'],['finance','مالی','finance.view'],['requests','درخواست‌ها','requests.view'],['chat','ارتباط داخلی','chat.access'],['reports','گزارش‌ها','reports.view']];
async function api(path,opt={}){const r=await fetch('/api/'+path,{credentials:'include',headers:{'content-type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'خطا');return d}
function can(p){return ME&&(ME.role==='Super Admin'||ME.role==='Operations Manager'||permissions.includes(p))}
async function boot(){try{const d=await api('auth/me');ME=d.user;permissions=ME.permissions||[];renderShell();route()}catch{renderLogin()}}
function renderLogin(){root.innerHTML='<div class="login"><div class="loginbox"><h1>BIPELC <span>OS</span></h1><p class="sub">سیستم مدیریت داخلی بی‌پلک</p><div id="loginErr"></div><div class="field"><label>نام کاربری</label><input id="lu" autocomplete="username"></div><div class="field" style="margin-top:10px"><label>رمز عبور</label><input id="lp" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%;margin-top:14px" onclick="login()">ورود</button></div></div>'}
async function login(){try{const d=await api('auth/login',{method:'POST',body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})});ME=d.user;permissions=ME.permissions||[];renderShell();location.hash='#dashboard';route()}catch(e){$('#loginErr').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function renderShell(){root.innerHTML='<div class="app"><aside class="side"><div class="brand">BIPELC<span> OS</span></div><div class="profile"><b>'+esc(ME.full_name)+'</b><small>'+esc(ME.job_title||ME.role)+'</small></div><div class="nav">'+nav.filter(x=>can(x[2])).map(x=>'<button data-page="'+x[0]+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'<button onclick="logout()">خروج</button></div></aside><main class="main"><div class="mobilebar"><b>BIPELC OS</b><button class="btn light" onclick="location.hash=\'#dashboard\';route()">داشبورد</button></div><div id="page"></div></main></div>'}
function go(p){location.hash='#'+p;route()} function route(){const p=location.hash.replace('#','')||'dashboard'; if(!can((nav.find(x=>x[0]===p)||nav[0])[2]))return go('dashboard');document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({dashboard:dashboard,clients:clients,projects:projects,tasks:tasks,employees:employees,hr:hr,freelancers:freelancers,legal:legal,finance:finance,requests:requests,chat:chat,reports:reports}[p]||dashboard)()}
async function logout(){await api('auth/logout');ME=null;permissions=[];renderLogin()}
function head(title,sub='',actions=''){return '<div class="top"><div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div><div>'+actions+'</div></div>'}
function table(items,cols,actions=''){if(!items.length)return '<div class="empty">هنوز داده‌ای ثبت نشده است.</div>';return '<div class="tablewrap"><table class="table"><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+(actions?'<th>عملیات</th>':'')+'</tr></thead><tbody>'+items.map(x=>'<tr>'+cols.map(c=>'<td>'+esc(c[0](x))+'</td>').join('')+(actions?'<td>'+actions(x)+'</td>':'')+'</tr>').join('')+'</tbody></table></div>'}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('show')} function closeModal(){$('#modal').classList.remove('show')}
const input=(name,label,value='',type='text')=>'<div class="field"><label>'+label+'</label><input id="f_'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'"></div>';
const select=(name,label,opts,value='')=>'<div class="field"><label>'+label+'</label><select id="f_'+name+'">'+opts.map(x=>'<option value="'+esc(x[0])+'" '+(x[0]===value?'selected':'')+'>'+esc(x[1])+'</option>').join('')+'</select></div>';
function form(fields,save){return '<div class="formgrid">'+fields.join('')+'</div><button class="btn" style="margin-top:15px" onclick="'+save+'">ذخیره</button>'}
function val(n){return $('#f_'+n)?.value||null}
async function dashboard(){const d=await api('dashboard/stats');const s=d.stats;page.innerHTML=head('داشبورد مدیریت','نمای کلی وضعیت شرکت')+'<div class="grid stats">'+[['درآمد این ماه',s.monthlyRevenue,'تومان'],['پروژه‌های فعال',s.activeProjects,''],['پروژه‌های عقب‌افتاده',s.overdueProjects,''],['مشتریان جدید',s.newClients,''],['مشتریان در انتظار پاسخ',s.pendingClients,''],['هزینه‌های جاری',s.monthlyExpenses,'تومان'],['سود خالص',s.netProfit,'تومان'],['بدهی مشتریان',s.customerDebt,'تومان'],['پرداخت‌های نزدیک',s.upcomingPayments,'تومان']].map(x=>'<div class="card stat"><span>'+x[0]+'</span><strong>'+Number(x[1]||0).toLocaleString('fa-IR')+' '+x[2]+'</strong></div>').join('')+'</div><div class="section"><h2>ویجت‌های سریع</h2><div class="grid actions">'+[['ساخت پروژه جدید','projects'],['ثبت مشتری جدید','clients'],['ارسال قرارداد','legal'],['ایجاد تسک','tasks'],['ثبت هزینه','finance'],['درخواست مرخصی','requests'],['گزارش روزانه','reports']].map(x=>'<button class="action" onclick="go(\''+x[1]+'\')">＋ '+x[0]+'</button>').join('')+'</div></div>'}
async function clients(){const d=await api('clients');page.innerHTML=head('مدیریت مشتریان','CRM و تاریخچه ارتباطات',can('clients.create')?'<button class="btn" onclick="clientForm()">+ مشتری جدید</button>':'')+'<div class="toolbar"><input id="search" placeholder="جستجوی شرکت..." oninput="filterRows()"></div>'+table(d.items,[x=>[y=>y.company_name,'شرکت'],x=>[y=>y.contact_person,'شخص ارتباطی'],x=>[y=>y.phone,'تماس'],x=>[y=>y.status,'وضعیت'],x=>[y=>y.score,'امتیاز']],x=>'<button class="btn light" onclick="clientView(\''+x.id+'\')">مشاهده</button> '+(can('clients.edit')?'<button class="btn light" onclick="clientForm(\''+x.id+'\')">ویرایش</button>':''))}
async function clientForm(rid){let x={};if(rid)x=(await api('clients/'+rid)).item;modal(rid?'ویرایش مشتری':'مشتری جدید',form([input('company_name','نام شرکت',x.company_name),input('contact_person','شخص ارتباطی',x.contact_person),input('phone','شماره تماس',x.phone),input('email','ایمیل',x.email,'email'),input('website','وب‌سایت',x.website),input('instagram','اینستاگرام',x.instagram),input('industry','حوزه فعالیت',x.industry),input('company_size','اندازه کسب‌وکار',x.company_size),select('status','وضعیت',[['New Lead','لید جدید'],['Contacted','تماس گرفته شده'],['Meeting','جلسه برگزار شده'],['Proposal Sent','پیشنهاد ارسال شده'],['Negotiation','مذاکره'],['Contracted','قرارداد بسته شده'],['Active','مشتری فعال'],['Lost','مشتری از دست رفته']],x.status),input('score','امتیاز مشتری',x.score,'number'),'<div class="field full"><label>یادداشت</label><textarea id="f_notes">'+esc(x.notes)+'</textarea></div>'],'saveClient(\''+(rid||'')+'\')'))}
async function saveClient(rid){const b={};['company_name','contact_person','phone','email','website','instagram','industry','company_size','status','score','notes'].forEach(k=>b[k]=val(k));try{if(rid)await api('clients/'+rid,{method:'PUT',body:JSON.stringify(b)});else await api('clients',{method:'POST',body:JSON.stringify(b)});closeModal();clients()}catch(e){alert(e.message)}}
async function clientView(id){const x=(await api('clients/'+id)).item;const h=await api('client-communications/'+id);modal('پرونده مشتری','<div class="kpi">'+[['شرکت',x.company_name],['شخص',x.contact_person],['تماس',x.phone],['ایمیل',x.email],['وب‌سایت',x.website],['اینستاگرام',x.instagram],['حوزه',x.industry],['وضعیت',x.status],['امتیاز',x.score]].map(a=>'<div class="card"><span class="sub">'+a[0]+'</span><b>'+esc(a[1]||'-')+'</b></div>').join('')+'</div><div class="section"><h2>تاریخچه ارتباط</h2>'+table(h.items,[x=>[y=>y.type,'نوع'],x=>[y=>y.subject,'موضوع'],x=>[y=>y.content,'متن'],x=>[y=>y.communication_date,'تاریخ']])+'</div>')}
async function projects(){const d=await api('projects');page.innerHTML=head('مدیریت پروژه‌ها','از قرارداد تا تحویل',can('projects.create')?'<button class="btn" onclick="projectForm()">+ پروژه جدید</button>':'')+table(d.items,[x=>[y=>y.title,'پروژه'],x=>[y=>y.status,'وضعیت'],x=>[y=>y.priority,'اولویت'],x=>[y=>y.progress+'%','پیشرفت'],x=>[y=>y.deadline,'Deadline'],x=>[y=>Number(y.budget||0).toLocaleString('fa-IR'),'بودجه']],x=>can('projects.edit')?'<button class="btn light" onclick="projectForm(\''+x.id+'\')">ویرایش</button>':'')}
async function projectForm(rid){let x={};if(rid)x=(await api('projects/'+rid)).item;const cs=(await api('clients')).items;modal(rid?'ویرایش پروژه':'پروژه جدید',form([input('title','عنوان پروژه',x.title),select('client_id','مشتری',[["",'بدون مشتری'],...cs.map(c=>[c.id,c.company_name])],x.client_id),input('budget','بودجه',x.budget,'number'),input('start_date','تاریخ شروع',x.start_date,'date'),input('deadline','Deadline',x.deadline,'date'),select('priority','اولویت',[['Low','کم'],['Medium','متوسط'],['High','زیاد'],['Urgent','فوری']],x.priority),select('status','وضعیت',[['Planning','برنامه‌ریزی'],['Active','فعال'],['On Hold','متوقف'],['Completed','تکمیل'],['Cancelled','لغو']],x.status),input('progress','درصد پیشرفت',x.progress,'number'),'<div class="field full"><label>شرح</label><textarea id="f_description">'+esc(x.description)+'</textarea></div>'],'saveProject(\''+(rid||'')+'\')'))}
async function saveProject(rid){const b={};['title','client_id','budget','start_date','deadline','priority','status','progress','description'].forEach(k=>b[k]=val(k));try{if(rid)await api('projects/'+rid,{method:'PUT',body:JSON.stringify(b)});else await api('projects',{method:'POST',body:JSON.stringify(b)});closeModal();projects()}catch(e){alert(e.message)}}
async function tasks(){const d=await api('tasks');const us=(await api('users')).items;page.innerHTML=head('مدیریت تسک‌ها','مسئول، Deadline، اولویت و وضعیت',can('tasks.create')?'<button class="btn" onclick="taskForm()">+ تسک جدید</button>':'')+table(d.items,[x=>[y=>y.title,'عنوان'],x=>[y=>us.find(u=>u.id===y.assigned_to)?.full_name||'-','مسئول'],x=>[y=>y.deadline,'زمان تحویل'],x=>[y=>y.priority,'اولویت'],x=>[y=>y.status,'وضعیت']],x=>can('tasks.edit')?'<button class="btn light" onclick="taskForm(\''+x.id+'\')">ویرایش</button>':'')}
async function taskForm(rid){let x={};if(rid)x=(await api('tasks/'+rid)).item;const us=(await api('users')).items,ps=(await api('projects')).items;modal(rid?'ویرایش تسک':'تسک جدید',form([input('title','عنوان',x.title),select('project_id','پروژه',[["",'بدون پروژه'],...ps.map(p=>[p.id,p.title])],x.project_id),select('assigned_to','مسئول',[["",'بدون مسئول'],...us.map(u=>[u.id,u.full_name])],x.assigned_to),input('deadline','Deadline',x.deadline,'date'),select('priority','اولویت',[['Low','کم'],['Medium','متوسط'],['High','زیاد'],['Urgent','فوری']],x.priority),select('status','وضعیت',[['TODO','انجام نشده'],['IN_PROGRESS','در حال انجام'],['REVIEW','بازبینی'],['DONE','انجام شده']],x.status),'<div class="field full"><label>توضیحات</label><textarea id="f_description">'+esc(x.description)+'</textarea></div>'],'saveTask(\''+(rid||'')+'\')'))}
async function saveTask(rid){const b={};['title','project_id','assigned_to','deadline','priority','status','description'].forEach(k=>b[k]=val(k));try{if(rid)await api('tasks/'+rid,{method:'PUT',body:JSON.stringify(b)});else await api('tasks',{method:'POST',body:JSON.stringify(b)});closeModal();tasks()}catch(e){alert(e.message)}}
async function employees(){const d=await api('users');page.innerHTML=head('کارمندان داخلی','پروفایل، سمت و دسترسی اختصاصی',can('users.create')?'<button class="btn" onclick="employeeForm()">+ کارمند جدید</button>':'')+table(d.items,[x=>[y=>y.full_name,'نام'],x=>[y=>y.job_title||'-','سمت'],x=>[y=>y.department||'-','بخش'],x=>[y=>y.role,'Role'],x=>[y=>y.status,'وضعیت']],x=>(can('users.edit')?'<button class="btn light" onclick="employeeForm(\''+x.id+'\')">ویرایش</button> ':'')+(can('users.permissions')?'<button class="btn light" onclick="permissionForm(\''+x.id+'\')">دسترسی</button>':''))}
async function employeeForm(rid){let x={};if(rid)x=(await api('users/'+rid)).item;modal(rid?'ویرایش کارمند':'افزودن کارمند',form([input('full_name','نام و نام خانوادگی',x.full_name),input('username','نام کاربری',x.username),input('password','رمز عبور','','password'),input('email','ایمیل',x.email,'email'),input('phone','شماره تماس',x.phone),select('role','سمت/Role',[['Employee','کارمند'],['Project Manager','مدیر پروژه'],['Operations Manager','مدیر عملیات'],['Super Admin','مدیر کل'],['Freelancer','فریلنسر']],x.role),input('department','بخش',x.department),input('job_title','عنوان شغلی',x.job_title),input('employment_type','نوع همکاری',x.employment_type),input('start_date','تاریخ شروع',x.start_date,'date'),input('salary','حقوق',x.salary,'number'),select('status','وضعیت',[['Active','فعال'],['Inactive','غیرفعال']],x.status)],'saveEmployee(\''+(rid||'')+'\')'))}
async function saveEmployee(rid){const b={};['full_name','email','phone','role','department','job_title','employment_type','start_date','salary','status'].forEach(k=>b[k]=val(k));try{if(rid){await api('users/'+rid,{method:'PUT',body:JSON.stringify(b)})}else{b.username=val('username');b.password=val('password');await api('users',{method:'POST',body:JSON.stringify(b)})}closeModal();employees()}catch(e){alert(e.message)}}
async function permissionForm(uid){const d=await api('users/'+uid+'/permissions'),u=(await api('users/'+uid)).item;modal('دسترسی‌های '+u.full_name,'<div class="sub" style="margin-bottom:10px">دسترسی هر بخش را مستقل فعال/غیرفعال کن.</div><div class="permgrid">'+d.permissions.map(p=>'<label class="perm"><input type="checkbox" data-perm="'+p.id+'" '+(p.allowed?'checked':'')+'> '+esc(p.label)+' <small>'+esc(p.key)+'</small></label>').join('')+'</div><button class="btn" style="margin-top:15px" onclick="savePerm(\''+uid+'\')">ذخیره دسترسی‌ها</button>')}
async function savePerm(uid){const permissions=[...document.querySelectorAll('[data-perm]')].map(x=>({id:x.dataset.perm,allowed:x.checked}));try{await api('users/'+uid+'/permissions',{method:'PUT',body:JSON.stringify({permissions})});closeModal();alert('دسترسی‌ها ذخیره شد')}catch(e){alert(e.message)}}
async function hr(){const [u,a,l,e]=await Promise.all([api('users'),api('attendance'),api('leave_requests').catch(()=>({items:[]})),api('evaluations')]);page.innerHTML=head('منابع انسانی','حضور و غیاب، مرخصی و ارزیابی ماهانه')+'<div class="section"><h2>کارمندان ثابت</h2>'+table(u.items,[x=>[y=>y.full_name,'نام'],x=>[y=>y.job_title||y.role,'سمت'],x=>[y=>y.start_date||'-','شروع همکاری'],x=>[y=>Number(y.salary||0).toLocaleString('fa-IR'),'حقوق'],x=>[y=>y.status,'وضعیت']])+'</div><div class="section"><h2>حضور و غیاب</h2>'+table(a.items,[x=>[y=>y.date,'تاریخ'],x=>[y=>u.items.find(z=>z.id===y.user_id)?.full_name||'-','کارمند'],x=>[y=>y.check_in||'-','ورود'],x=>[y=>y.check_out||'-','خروج'],x=>[y=>y.type,'نوع']])+'</div><div class="section"><h2>ارزیابی ماهانه</h2>'+table(e.items,[x=>[y=>u.items.find(z=>z.id===y.user_id)?.full_name||'-','کارمند'],x=>[y=>y.month,'ماه'],x=>[y=>y.quality,'کیفیت'],x=>[y=>y.speed,'سرعت'],x=>[y=>y.responsibility,'مسئولیت'],x=>[y=>y.teamwork,'تیمی']])+'</div>'}
async function freelancers(){const d=await api('freelancers');page.innerHTML=head('مدیریت فریلنسرها','شبکه متخصصان بی‌پلک',can('freelancers.create')?'<button class="btn" onclick="freelancerForm()">+ متخصص جدید</button>':'')+table(d.items,[x=>[y=>y.name,'نام'],x=>[y=>y.specialty,'تخصص'],x=>[y=>y.city,'شهر'],x=>[y=>Number(y.rate||0).toLocaleString('fa-IR'),'قیمت'],x=>[y=>y.availability,'دسترسی'],x=>[y=>y.status,'وضعیت']],x=>can('freelancers.edit')?'<button class="btn light" onclick="freelancerForm(\''+x.id+'\')">ویرایش</button>':'')}
async function freelancerForm(rid){let x={};if(rid)x=(await api('freelancers/'+rid)).item;modal(rid?'ویرایش متخصص':'متخصص جدید',form([input('name','نام',x.name),input('specialty','تخصص',x.specialty),input('phone','شماره',x.phone),input('email','ایمیل',x.email),input('city','شهر',x.city),input('portfolio','نمونه کار / لینک',x.portfolio),input('rate','قیمت',x.rate,'number'),input('equipment','تجهیزات',x.equipment),input('experience','سابقه',x.experience),select('availability','دسترسی',[['Available','در دسترس'],['Busy','مشغول'],['Unavailable','غیرفعال']],x.availability),'<div class="field full"><label>یادداشت</label><textarea id="f_notes">'+esc(x.notes)+'</textarea></div>'],'saveFreelancer(\''+(rid||'')+'\')'))}
async function saveFreelancer(rid){const b={};['name','specialty','phone','email','city','portfolio','rate','equipment','experience','availability','notes'].forEach(k=>b[k]=val(k));try{if(rid)await api('freelancers/'+rid,{method:'PUT',body:JSON.stringify(b)});else await api('freelancers',{method:'POST',body:JSON.stringify(b)});closeModal();freelancers()}catch(e){alert(e.message)}}
async function legal(){const d=await api('contracts');page.innerHTML=head('بخش حقوقی','قرارداد مشتری، فریلنسر و همکاری',can('legal.edit')?'<button class="btn" onclick="contractForm()">+ قرارداد جدید</button>':'')+table(d.items,[x=>[y=>y.type,'نوع'],x=>[y=>y.title,'عنوان'],x=>[y=>y.contract_number||'-','شماره'],x=>[y=>y.amount,'مبلغ'],x=>[y=>y.status,'وضعیت'],x=>[y=>y.start_date||'-','شروع'],x=>[y=>y.end_date||'-','پایان']],x=>can('legal.edit')?'<button class="btn light" onclick="contractForm(\''+x.id+'\')">ویرایش</button>':'')}
async function contractForm(rid){let x={};if(rid)x=(await api('contracts/'+rid)).item;modal(rid?'ویرایش قرارداد':'قرارداد جدید',form([select('type','نوع',[['client','قرارداد مشتری'],['freelancer','قرارداد فریلنسر'],['cooperation','قرارداد همکاری']],x.type),input('title','عنوان',x.title),input('contract_number','شماره قرارداد',x.contract_number),input('amount','مبلغ',x.amount,'number'),input('start_date','شروع',x.start_date,'date'),input('end_date','پایان',x.end_date,'date'),select('status','وضعیت',[['Draft','پیش‌نویس'],['Sent','ارسال شده'],['Signed','امضا شده'],['Expired','منقضی']],x.status),input('file_url','لینک فایل قرارداد',x.file_url)],'saveContract(\''+(rid||'')+'\')'))}
async function saveContract(rid){const b={};['type','title','contract_number','amount','start_date','end_date','status','file_url'].forEach(k=>b[k]=val(k));try{if(rid)await api('contracts/'+rid,{method:'PUT',body:JSON.stringify(b)});else await api('contracts',{method:'POST',body:JSON.stringify(b)});closeModal();legal()}catch(e){alert(e.message)}}
async function finance(){const d=await api('finances');const income=d.items.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount||0),0),expense=d.items.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount||0),0);page.innerHTML=head('مالی','درآمد، پرداخت مشتری، پیش‌پرداخت، تسویه و هزینه‌ها',can('finance.edit')?'<button class="btn" onclick="financeForm()">+ ثبت تراکنش</button>':'')+'<div class="grid stats"><div class="card stat"><span>درآمد</span><strong>'+income.toLocaleString('fa-IR')+' تومان</strong></div><div class="card stat"><span>هزینه</span><strong>'+expense.toLocaleString('fa-IR')+' تومان</strong></div><div class="card stat"><span>سود</span><strong>'+(income-expense).toLocaleString('fa-IR')+' تومان</strong></div></div><div class="section">'+table(d.items,[x=>[y=>y.type==='income'?'درآمد':'هزینه','نوع'],x=>[y=>y.category,'دسته'],x=>[y=>Number(y.amount||0).toLocaleString('fa-IR'),'مبلغ'],x=>[y=>y.date,'تاریخ'],x=>[y=>y.description||'-','شرح']])+'</div>'}
async function financeForm(){modal('ثبت تراکنش',form([select('type','نوع',[['income','درآمد'],['expense','هزینه']]),select('category','دسته',[['Contract','قرارداد'],['Client Payment','پرداخت مشتری'],['Deposit','پیش پرداخت'],['Settlement','تسویه'],['Freelancer','دستمزد فریلنسر'],['Equipment','تجهیزات'],['Rent','اجاره'],['Advertising','تبلیغات'],['Software','نرم‌افزار'],['Other','سایر']]),input('amount','مبلغ','', 'number'),input('date','تاریخ',new Date().toISOString().slice(0,10),'date'),input('project_id','شناسه پروژه'),input('client_id','شناسه مشتری'),input('freelancer_id','شناسه فریلنسر'),input('description','شرح')],'saveFinance()'))}
async function saveFinance(){const b={};['type','category','amount','date','project_id','client_id','freelancer_id','description'].forEach(k=>b[k]=val(k));try{await api('finances',{method:'POST',body:JSON.stringify(b)});closeModal();finance()}catch(e){alert(e.message)}}
async function requests(){const d=await api('requests');page.innerHTML=head('سیستم درخواست‌ها','درخواست‌های کارکنان و گردش تایید',can('requests.create')?'<button class="btn" onclick="requestForm()">+ ثبت درخواست</button>':'')+table(d.items,[x=>[y=>y.ticket_number,'تیکت'],x=>[y=>y.title,'عنوان'],x=>[y=>y.type,'نوع'],x=>[y=>y.priority,'اولویت'],x=>[y=>y.status,'وضعیت'],x=>[y=>y.created_at,'تاریخ']],x=>can('requests.approve')?'<button class="btn light" onclick="approveRequest(\''+x.id+'\')">مدیریت</button>':'')}
async function requestForm(){modal('ثبت درخواست',form([select('type','نوع',[['leave','مرخصی'],['equipment','خرید تجهیزات'],['technical','کمک فنی'],['new_hire','نیروی جدید'],['finance','درخواست مالی'],['general','عمومی']]),input('title','عنوان'),select('priority','اولویت',[['Low','کم'],['Medium','متوسط'],['High','زیاد']]),'<div class="field full"><label>توضیحات</label><textarea id="f_description"></textarea></div>'],'saveRequest()'))}
async function saveRequest(){const b={};['type','title','priority','description'].forEach(k=>b[k]=val(k));try{await api('requests',{method:'POST',body:JSON.stringify(b)});closeModal();requests()}catch(e){alert(e.message)}}
async function approveRequest(id){const x=(await api('requests/'+id)).item;modal('مدیریت درخواست',form([select('status','وضعیت',[['Pending','در انتظار'],['Reviewing','در حال بررسی'],['Approved','تایید'],['Rejected','رد'],['Completed','انجام شد']],x.status),input('manager_reply','پاسخ مدیر',x.manager_reply)],'saveRequestEdit(\''+id+'\')'))}
async function saveRequestEdit(id){const b={status:val('status'),manager_reply:val('manager_reply')};try{await api('requests/'+id,{method:'PUT',body:JSON.stringify(b)});closeModal();requests()}catch(e){alert(e.message)}}
async function chat(){const d=await api('conversations');page.innerHTML=head('ارتباط داخلی تیم','چت پروژه، پیام مستقیم و اعلان‌ها',can('chat.access')?'<button class="btn" onclick="conversationForm()">+ گفتگوی جدید</button>':'')+table(d.items,[x=>[y=>y.title||'گفتگو','عنوان'],x=>[y=>y.type,'نوع'],x=>[y=>y.created_at,'تاریخ']],x=>'<button class="btn light" onclick="openChat(\''+x.id+'\')">باز کردن</button>')}
async function conversationForm(){modal('گفتگوی جدید',form([select('type','نوع',[['project','چت پروژه'],['direct','پیام مستقیم'],['group','گروهی']]),input('title','عنوان')],'saveConversation()'))}
async function saveConversation(){try{await api('conversations',{method:'POST',body:JSON.stringify({type:val('type'),title:val('title')})});closeModal();chat()}catch(e){alert(e.message)}}
async function openChat(id){const d=await api('messages');const msgs=d.items.filter(x=>x.conversation_id===id);modal('گفتگو','<div style="max-height:350px;overflow:auto">'+(msgs.length?msgs.map(m=>'<div class="card" style="margin-bottom:7px">'+esc(m.message)+'<div class="sub">'+esc(m.created_at)+'</div></div>').join(''):'<div class="empty">هنوز پیامی نیست.</div>')+'</div><div class="toolbar" style="margin-top:10px"><input id="chatMsg" placeholder="پیام..."><button class="btn" onclick="sendMsg(\''+id+'\')">ارسال</button></div>')}
async function sendMsg(cid){const m=$('#chatMsg').value.trim();if(!m)return;try{await api('messages',{method:'POST',body:JSON.stringify({conversation_id:cid,message:m})});openChat(cid)}catch(e){alert(e.message)}}
async function reports(){const d=await api('reports/summary');page.innerHTML=head('گزارش‌ها','سود پروژه، سود ماهانه و عملکرد کلی')+'<div class="grid stats"><div class="card stat"><span>درآمد ماه</span><strong>'+Number(d.stats.monthlyRevenue).toLocaleString('fa-IR')+'</strong></div><div class="card stat"><span>هزینه ماه</span><strong>'+Number(d.stats.monthlyExpenses).toLocaleString('fa-IR')+'</strong></div><div class="card stat"><span>سود ماه</span><strong>'+Number(d.stats.netProfit).toLocaleString('fa-IR')+'</strong></div></div><div class="section"><h2>وضعیت پروژه‌ها</h2>'+table(d.projects,[x=>[y=>y.title,'پروژه'],x=>[y=>y.company_name||'-','مشتری'],x=>[y=>y.budget,'بودجه'],x=>[y=>y.progress+'%','پیشرفت'],x=>[y=>y.status,'وضعیت'],x=>[y=>y.deadline||'-','Deadline']])+'</div>'}
function filterRows(){const q=($('#search')?.value||'').toLowerCase();document.querySelectorAll('.table tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
window.addEventListener('hashchange',route);boot();
</script></body></html>
