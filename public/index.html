<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIPELAK OS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#162033;--muted:#718096;--line:#e7ebf2;--brand:#635bff;--brand2:#4f46e5;--green:#16a34a;--red:#dc2626;--amber:#d97706;--shadow:0 12px 35px rgba(31,41,55,.07);--radius:18px}*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#e9e7ff 0,transparent 35%),linear-gradient(135deg,#f7f8fc,#eef1ff)}.login-card{width:min(430px,92vw);background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 25px 80px rgba(47,54,90,.14)}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--brand),#8b5cf6);color:#fff;display:grid;place-items:center;font-weight:800}.login h1{margin:26px 0 7px;font-size:27px}.login p{color:var(--muted);margin:0 0 24px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field label{font-size:13px;font-weight:600}.field input,.field select,.field textarea{border:1px solid var(--line);background:#fbfcfe;border-radius:12px;padding:11px 13px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#a5b4fc;box-shadow:0 0 0 4px #eef2ff}.btn{border:0;border-radius:12px;padding:10px 15px;background:var(--brand);color:#fff;font-weight:600}.btn:hover{background:var(--brand2)}.btn.secondary{background:#eef2ff;color:#4338ca}.btn.ghost{background:#f5f7fb;color:#334155}.btn.danger{background:#fee2e2;color:#b91c1c}.btn.full{width:100%;padding:13px}.shell{display:flex;min-height:100vh}.sidebar{width:260px;background:#111827;color:#dbe4f0;padding:18px 14px;position:fixed;right:0;top:0;bottom:0;z-index:20;overflow:auto}.side-brand{padding:9px 10px 25px;display:flex;align-items:center;gap:11px}.side-brand .logo{background:linear-gradient(135deg,#7c73ff,#a78bfa)}.nav-title{font-size:11px;color:#64748b;margin:20px 10px 8px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:right;padding:11px 12px;border-radius:11px;display:flex;align-items:center;gap:10px}.nav button:hover,.nav button.active{background:#1f2937;color:#fff}.main{width:calc(100% - 260px);margin-right:260px}.topbar{height:76px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.top-title{font-size:20px;font-weight:750}.top-actions{display:flex;gap:9px;align-items:center}.avatar{width:38px;height:38px;border-radius:12px;background:#ede9fe;color:#5b21b6;display:grid;place-items:center;font-weight:700}.content{padding:28px;max-width:1600px;margin:auto}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}.hero h1{margin:0;font-size:27px}.hero p{margin:7px 0 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.stat{padding:19px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.stat-icon{width:38px;height:38px;border-radius:12px;background:#eef2ff;color:#4f46e5;display:grid;place-items:center}.stat-value{font-size:25px;font-weight:800;margin-top:14px}.stat-sub{font-size:12px;color:var(--muted);margin-top:5px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}.panel{padding:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.panel-head h3{margin:0;font-size:16px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px;text-align:right}.quick button:hover{border-color:#c7d2fe;background:#f8faff}.quick b{display:block;margin-bottom:5px}.quick span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:15px}.search{flex:1}.search input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:13px}.table th{background:#fafbfe;color:#64748b;font-weight:700}.table tr:last-child td{border-bottom:0}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eef2ff;color:#4338ca}.badge.green{background:#dcfce7;color:#15803d}.badge.red{background:#fee2e2;color:#b91c1c}.badge.amber{background:#fef3c7;color:#a16207}.empty{padding:40px;text-align:center;color:var(--muted)}.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 30px 100px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:19px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-start;gap:9px;margin-top:18px}.toast{position:fixed;left:22px;bottom:22px;background:#111827;color:#fff;padding:12px 17px;border-radius:12px;z-index:100;box-shadow:var(--shadow)}.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:10px;border-radius:10px;font-size:13px;margin-bottom:12px}.mobile-menu{display:none}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:780px){.sidebar{transform:translateX(100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{width:100%;margin-right:0}.mobile-menu{display:inline-flex}.content{padding:18px}.topbar{padding:0 16px}.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.hero{flex-direction:column}}
</style></head><body><div id="root"></div><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={user:null,page:'dashboard',items:[],search:'',loading:false};
const resources={clients:{title:'مشتریان',icon:'◉',fields:[['company_name','نام شرکت'],['contact_person','شخص ارتباطی'],['phone','شماره تماس'],['email','ایمیل'],['website','وب‌سایت'],['instagram','اینستاگرام'],['industry','حوزه فعالیت'],['company_size','اندازه کسب‌وکار'],['status','وضعیت'],['score','امتیاز'],['notes','یادداشت','textarea']]},projects:{title:'پروژه‌ها',icon:'▣',fields:[['title','عنوان پروژه'],['client_id','مشتری'],['manager_id','مدیر پروژه'],['description','توضیحات','textarea'],['budget','بودجه','number'],['start_date','شروع','date'],['deadline','ددلاین','date'],['priority','اولویت'],['status','وضعیت'],['progress','پیشرفت','number']]},tasks:{title:'تسک‌ها',icon:'✓',fields:[['title','عنوان'],['project_id','پروژه'],['assigned_to','مسئول'],['priority','اولویت'],['status','وضعیت'],['deadline','زمان تحویل','date'],['description','توضیحات','textarea']]},employees:{title:'کارمندان',icon:'♟',api:'users',fields:[['username','نام کاربری'],['password','رمز عبور','password'],['full_name','نام و نام خانوادگی'],['phone','شماره تماس'],['email','ایمیل'],['role','سمت/نقش'],['department','بخش'],['job_title','عنوان شغلی'],['employment_type','نوع همکاری'],['start_date','شروع همکاری','date'],['salary','حقوق','number'],['status','وضعیت']]},freelancers:{title:'فریلنسرها',icon:'✦',fields:[['name','نام'],['specialty','تخصص'],['phone','شماره تماس'],['email','ایمیل'],['city','شهر'],['portfolio','نمونه‌کار'],['rate','قیمت','number'],['equipment','تجهیزات'],['experience','سابقه'],['availability','دسترسی'],['status','وضعیت'],['notes','یادداشت','textarea']]},finance:{title:'مالی',icon:'₮',api:'finances',fields:[['type','نوع تراکنش'],['category','دسته‌بندی'],['amount','مبلغ','number'],['project_id','پروژه'],['client_id','مشتری'],['freelancer_id','فریلنسر'],['description','شرح','textarea'],['date','تاریخ','date']]},contracts:{title:'قراردادها',icon:'§',api:'contracts',fields:[['type','نوع قرارداد'],['title','عنوان'],['client_id','مشتری'],['freelancer_id','فریلنسر'],['employee_id','کارمند'],['project_id','پروژه'],['contract_number','شماره قرارداد'],['start_date','شروع','date'],['end_date','پایان','date'],['amount','مبلغ','number'],['status','وضعیت'],['file_url','لینک فایل'],['notes','یادداشت','textarea']]},hr:{title:'منابع انسانی',icon:'♙',api:'attendance',fields:[['user_id','کارمند'],['date','تاریخ','date'],['check_in','ورود'],['check_out','خروج'],['type','نوع'],['notes','یادداشت','textarea']]},requests:{title:'درخواست‌ها',icon:'?',api:'requests',fields:[['type','نوع درخواست'],['title','عنوان'],['description','توضیحات','textarea'],['priority','اولویت'],['status','وضعیت']]},chat:{title:'ارتباط داخلی',icon:'◌',api:'conversations',fields:[['type','نوع گفتگو'],['title','عنوان'],['project_id','پروژه']]}};
const nav=[['dashboard','داشبورد','⌂'],['clients','مشتریان','◉'],['projects','پروژه‌ها','▣'],['tasks','تسک‌ها','✓'],['employees','کارمندان','♟'],['hr','منابع انسانی','♙'],['freelancers','فریلنسرها','✦'],['contracts','قراردادها','§'],['finance','مالی','₮'],['requests','درخواست‌ها','?'],['chat','ارتباط داخلی','◌']];
async function api(path,opt={}){const r=await fetch('/api'+path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'خطایی رخ داد');return d}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2600)}
function money(n){return new Intl.NumberFormat('fa-IR').format(Math.round(Number(n)||0))+' تومان'}
function login(){document.body.innerHTML=`<div class="login"><div class="login-card"><div class="brand"><div class="logo">B</div><span>BIPELAK OS</span></div><h1>خوش اومدی 👋</h1><p>وارد پنل مدیریت بی‌پلک شو.</p><div id="loginErr"></div><form id="loginForm"><div class="field"><label>نام کاربری</label><input name="username" autocomplete="username" required></div><div class="field"><label>رمز عبور</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn full">ورود به پنل</button></form></div></div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});state.user=d.user;render()}catch(err){$('#loginErr').innerHTML='<div class="error">'+err.message+'</div>'}}}
function shell(){document.body.innerHTML=`<div class="shell"><aside class="sidebar" id="sidebar"><div class="side-brand"><div class="logo">B</div><div><b>BIPELAK OS</b><small style="display:block;color:#64748b">Workspace</small></div></div><div class="nav-title">مدیریت</div><nav class="nav">${nav.map(n=>`<button data-page="${n[0]}" class="${state.page===n[0]?'active':''}"><span>${n[2]}</span>${n[1]}</button>`).join('')}</nav><div class="nav-title">حساب</div><nav class="nav"><button id="logout">↪ خروج</button></nav></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn ghost mobile-menu" id="menu">☰</button><div class="top-title">${title()}</div></div><div class="top-actions"><button class="btn ghost" id="refresh">↻</button><div class="avatar">${(state.user?.full_name||'م')[0]}</div><div style="font-size:12px"><b>${state.user?.full_name||''}</b><div style="color:var(--muted)">${state.user?.role||''}</div></div></div></header><section class="content" id="content"></section></main></div>`;$$('.nav button[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});$('#logout').onclick=async()=>{await api('/auth/logout',{method:'POST'}).catch(()=>{});state.user=null;login()};$('#refresh').onclick=()=>render();$('#menu').onclick=()=>$('#sidebar').classList.toggle('open')}
function title(){return state.page==='dashboard'?'داشبورد مدیریت':(resources[state.page]?.title||'پنل')}
async function render(){if(!state.user){login();return}shell();const c=$('#content');if(state.page==='dashboard'){await dashboard(c);return}await listPage(c,state.page)}
async function dashboard(c){c.innerHTML=`<div class="hero"><div><h1>سلام، ${state.user.full_name||'مدیر'} 👋</h1><p>نمای کلی وضعیت کسب‌وکار و عملیات امروز</p></div><button class="btn" id="newQuick">＋ ثبت اطلاعات</button></div><div class="cards" id="stats"><div class="card stat">در حال بارگذاری…</div></div><div class="grid2"><div class="card panel"><div class="panel-head"><h3>دسترسی سریع</h3></div><div class="quick">${[['projects','ساخت پروژه جدید','شروع پروژه'],['clients','ثبت مشتری جدید','افزودن به CRM'],['contracts','ارسال قرارداد','ثبت قرارداد'],['tasks','ایجاد تسک','کار جدید'],['finance','ثبت هزینه','هزینه جاری'],['requests','درخواست مرخصی','ثبت درخواست'],['requests','گزارش روزانه','ارسال گزارش'],['employees','افزودن کارمند','عضو جدید']].map(x=>`<button data-q="${x[0]}"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}</div></div><div class="card panel"><div class="panel-head"><h3>وضعیت سیستم</h3></div><div id="sys">در حال بررسی…</div></div></div>`;try{const d=await api('/dashboard/stats');const s=d.stats;$('#stats').innerHTML=[['درآمد این ماه',money(s.monthlyRevenue),'↑'],['پروژه‌های فعال',s.activeProjects,'●'],['پروژه‌های عقب‌افتاده',s.overdueProjects,'!'],['مشتریان جدید',s.newClients,'＋'],['در انتظار پاسخ',s.pendingClients,'…'],['هزینه‌های جاری',money(s.monthlyExpenses),'−'],['سود خالص',money(s.netProfit),'↗'],['بدهی مشتریان',money(s.customerDebt),'₮']].map(x=>`<div class="card stat"><div class="stat-top"><span>${x[0]}</span><span class="stat-icon">${x[2]}</span></div><div class="stat-value">${x[1]}</div><div class="stat-sub">این ماه / وضعیت فعلی</div></div>`).join('');$('#sys').innerHTML=`<div style="display:grid;gap:10px"><div>پرداخت‌های نزدیک: <b>${money(s.upcomingPayments)}</b></div><div>نقش: <b>${state.user.role}</b></div><div>وضعیت: <span class="badge green">Active</span></div></div>`}catch(e){$('#stats').innerHTML=`<div class="error">${e.message}</div>`}$$('[data-q]').forEach(b=>b.onclick=()=>{state.page=b.dataset.q;render()})}
async function listPage(c,key){const cfg=resources[key];const apiKey=cfg.api||key;c.innerHTML=`<div class="hero"><div><h1>${cfg.title}</h1><p>مدیریت و ثبت اطلاعات ${cfg.title}</p></div><button class="btn" id="add">＋ افزودن</button></div><div class="card panel"><div class="toolbar"><div class="search"><input id="search" placeholder="جستجو در ${cfg.title}…"></div><button class="btn ghost" id="reload">↻ بروزرسانی</button></div><div class="table-wrap" id="table"><div class="empty">در حال بارگذاری…</div></div></div>`;$('#search').value=state.search;$('#search').oninput=e=>{state.search=e.target.value;loadTable()};$('#reload').onclick=loadTable;$('#add').onclick=()=>formModal(key);await loadTable();async function loadTable(){try{const d=await api('/'+apiKey+(state.search?'?q='+encodeURIComponent(state.search):''));state.items=d.items||[];drawTable()}catch(e){$('#table').innerHTML='<div class="error">'+e.message+'</div>'}}function drawTable(){if(!state.items.length){$('#table').innerHTML='<div class="empty">اطلاعاتی ثبت نشده. اولین مورد را اضافه کن.</div>';return}const sample=state.items.slice(0,100);const keys=[...new Set(sample.flatMap(x=>Object.keys(x)))].filter(k=>!['password_hash','permissions','updated_at'].includes(k)).slice(0,7);$('#table').innerHTML='<table class="table"><thead><tr>'+keys.map(k=>'<th>'+label(k)+'</th>').join('')+'<th>عملیات</th></tr></thead><tbody>'+sample.map(x=>'<tr>'+keys.map(k=>'<td>'+cell(k,x[k])+'</td>').join('')+'<td><button class="btn ghost" data-edit="'+x.id+'">ویرایش</button></td></tr>').join('')+'</tbody></table>';$$('[data-edit]').forEach(b=>b.onclick=()=>formModal(key,state.items.find(x=>x.id===b.dataset.edit)))}}
function label(k){const m={company_name:'نام شرکت',contact_person:'شخص ارتباطی',phone:'تلفن',email:'ایمیل',title:'عنوان',status:'وضعیت',priority:'اولویت',deadline:'ددلاین',progress:'پیشرفت',budget:'بودجه',name:'نام',specialty:'تخصص',amount:'مبلغ',date:'تاریخ',type:'نوع',category:'دسته‌بندی',full_name:'نام و نام خانوادگی',username:'نام کاربری',role:'نقش',department:'بخش',job_title:'سمت',start_date:'شروع',description:'توضیحات',ticket_number:'شماره درخواست'};return m[k]||k}
function cell(k,v){if(v===null||v===undefined||v==='')return '—';if(k==='amount'||k==='budget'||k==='salary'||k==='rate')return money(v);if(k==='status')return '<span class="badge '+(['Active','Paid','Completed','Approved'].includes(v)?'green':(['Overdue','Rejected','Cancelled'].includes(v)?'red':'amber'))+'">'+v+'</span>';if(k==='progress')return v+'%';return String(v).slice(0,70)}
function formModal(key,item=null){const cfg=resources[key],apiKey=cfg.api||key;const values=item||{};const fields=cfg.fields.filter(f=>!item||f[0]!=='password');const html=`<div class="modal-back" id="modal"><div class="modal"><div class="modal-head"><h2>${item?'ویرایش':'افزودن'} ${cfg.title}</h2><button class="btn ghost" id="close">×</button></div><form id="entityForm"><div class="form-grid">${fields.map(f=>`<div class="field ${f[2]==='textarea'?'wide':''}"><label>${f[1]}</label>${f[2]==='textarea'?`<textarea name="${f[0]}" rows="3">${values[f[0]]??''}</textarea>`:`<input name="${f[0]}" type="${f[2]||'text'}" value="${values[f[0]]??''}" ${f[0]==='username'&&item?'disabled':''}>`}</div>`).join('')}</div><div id="formErr"></div><div class="modal-actions"><button class="btn">ذخیره</button><button type="button" class="btn ghost" id="cancel">انصراف</button></div></form></div></div>`;document.body.insertAdjacentHTML('beforeend',html);$('#close').onclick=$('#cancel').onclick=()=>$('#modal').remove();$('#entityForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),b=Object.fromEntries(fd);for(const k of Object.keys(b))if(b[k]==='')b[k]=null;try{await api('/'+apiKey+(item?'/'+item.id:''),{method:item?'PUT':'POST',body:JSON.stringify(b)});$('#modal').remove();toast('با موفقیت ذخیره شد');render()}catch(err){$('#formErr').innerHTML='<div class="error">'+err.message+'</div>'}}}
(async()=>{try{const d=await api('/auth/me');state.user=d.user;state.page=location.hash.replace('#/','')||'dashboard';render()}catch{login()}})();
</script></body></html>
